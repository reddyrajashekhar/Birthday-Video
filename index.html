
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Meghana ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe0ed, #f6d8ff);
            font-family: Arial, sans-serif;
            text-align: center;
            color: #a51359;
        }

        .card {
            padding: 30px;
            max-width: 600px;
        }

        h1 {
            font-size: clamp(32px, 7vw, 55px);
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            background: #d41470;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px 28px;
            font-size: 18px;
            cursor: pointer;
        }

        video {
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            margin-top: 20px;
        }

        #birthdayScreen {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card" id="firstScreen">
        <div style="font-size:80px">🎁</div>
        <h1>Hey Meghana! ❤️</h1>
        <p>I have a little surprise waiting for you...</p>
        <button onclick="openSurprise()">Open Your Surprise ✨</button>
    </div>

    <div class="card" id="birthdayScreen">
        <div style="font-size:70px">🎂🎉</div>
        <h1>Happy Birthday Meghana! ❤️</h1>

        <p>
            Wishing you a beautiful birthday filled
            with happiness, laughter, love and
            unforgettable memories.
        </p>

        <h2>A Special Video Just for You ❤️</h2>

        <video controls playsinline>
            <source src="Birthday%20Video.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <p>Keep smiling and have an amazing birthday! 💕</p>
    </div>

    <script>
        function openSurprise() {
            document.getElementById("firstScreen").style.display = "none";
            document.getElementById("birthdayScreen").style.display = "block";
        }
    </script>

</body>
</html>
